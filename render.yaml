# Render blueprint for Project Touchline.
#
# This describes the deployed service. The live service was created from the
# Dockerfile, so the blueprint uses the Docker runtime too. To recreate it from
# scratch: Render -> New + -> Blueprint -> pick this repository, then supply
# FOOTBALL_DATA_API_KEY when prompted.
#
# NODE_ENV, PORT and the ENABLE_* research flags are intentionally not listed:
# the Dockerfile sets NODE_ENV=production, the app falls back to port 3000
# (Render injects its own PORT), and every research flag defaults to false. The
# provider secret is the only value that must be supplied.

services:
  - type: web
    name: Touchline-football-
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/status
    envVars:
      # Required. Set the real value in the Render dashboard; never commit it.
      - key: FOOTBALL_DATA_API_KEY
        sync: false

